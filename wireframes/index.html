<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chill Hub Wireframes</title>
<style>
  :root {
    --ink: #1f1f1f; --muted: #6f6f6f; --faint: #9a9a9a;
    --line: #cfcfcf; --fill: #e9e9e9; --fill2: #f4f4f4; --bg: #fafafa; --white: #ffffff;
    --accent: #4f46e5; --accent-soft: #e8e7fd; --warn: #b45309; --warn-soft: #fdf1e3;
    --ok: #2f7d4f; --ok-soft: #e4f3ea; --bad: #b42318; --bad-soft: #fdecea;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #ececec; }
  button { font: inherit; }

  /* ---------- prototype shell ---------- */
  .shell { display: grid; grid-template-columns: 250px 1fr 300px; height: 100vh; }
  .side, .notes { background: var(--white); overflow-y: auto; padding: 16px; border-right: 1px solid var(--line); }
  .notes { border-right: 0; border-left: 1px solid var(--line); }
  .side h1 { font-size: 16px; margin: 0 0 2px; }
  .side .ver { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
  .side a { display: block; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px; }
  .side a:hover { background: var(--fill2); }
  .side a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .side a.todo { color: var(--faint); pointer-events: none; }
  .side a.todo::after { content: " · next batch"; font-size: 11px; }
  .stage { overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 28px 16px; }
  .notes h3 { margin: 0 0 4px; font-size: 16px; }
  .notes .spec { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .notes p, .notes li { font-size: 13px; }
  .notes ul { padding-left: 18px; }
  .notes .q { background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; margin-top: 12px; }
  .notes .q b { display: block; margin-bottom: 4px; color: var(--warn); }
  .mobile-pick { display: none; }

  /* ---------- phone frame ---------- */
  .phone { width: 375px; height: 780px; background: var(--white); border: 10px solid #2b2b2b; border-radius: 38px; overflow: hidden;
           display: flex; flex-direction: column; position: relative; flex-shrink: 0; }
  .status { height: 30px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 12px; font-weight: 600; }
  .screen { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg); }
  .screen::-webkit-scrollbar { width: 0; }

  /* ---------- wireframe components ---------- */
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--white); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  .top .title { font-weight: 700; font-size: 17px; flex: 1; }
  .icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--white); display: grid; place-items: center; cursor: pointer; position: relative; flex-shrink: 0; }
  .icon-btn .dot { position: absolute; top: -2px; right: -2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }
  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .center { align-items: center; text-align: center; justify-content: center; }
  h2.h { font-size: 20px; margin: 0; }
  h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 6px 0 -4px; display: flex; justify-content: space-between; align-items: baseline; }
  h3.sec a { text-transform: none; letter-spacing: 0; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; }
  .sub { color: var(--muted); margin: 0; }
  .ph { background: var(--fill); border: 1px dashed var(--faint); border-radius: var(--radius); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--white); font-weight: 600; cursor: pointer; width: 100%; color: var(--ink); text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
  .btn.sm { height: 34px; width: auto; padding: 0 14px; font-size: 13px; }
  .field { display: flex; flex-direction: column; gap: 5px; text-align: left; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .input { height: 44px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); padding: 0 12px; display: flex; align-items: center; color: var(--faint); gap: 8px; }
  .input.filled { color: var(--ink); }
  .hint { font-size: 12px; color: var(--muted); }
  .hint.err { color: var(--bad); }
  .steps { display: flex; gap: 6px; }
  .steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--fill); }
  .steps span.on { background: var(--accent); }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .game { width: 38px; height: 38px; border-radius: 8px; background: var(--fill); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); flex-shrink: 0; }
  .strong { font-weight: 700; }
  .small { font-size: 12px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 12px; background: var(--fill2); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
  .chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
  .chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .slots { display: flex; gap: 3px; align-items: center; }
  .slots i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: block; }
  .slots i.e { background: transparent; border: 1.5px solid var(--faint); }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--fill); border: 1px solid var(--line); flex-shrink: 0; }
  .avatar.lg { width: 64px; height: 64px; }
  .hscroll { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; }
  .hscroll::-webkit-scrollbar { height: 0; }
  .hscroll .card { min-width: 250px; }
  .code { font-family: ui-monospace, Consolas, monospace; background: var(--fill2); border: 1px dashed var(--faint); border-radius: 6px; padding: 2px 8px; font-weight: 700; letter-spacing: .05em; }
  .list-item { display: flex; gap: 10px; align-items: center; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; cursor: pointer; }
  .thumb { width: 54px; height: 54px; border-radius: 8px; flex-shrink: 0; }
  .otp { display: flex; gap: 8px; justify-content: center; }
  .otp span { width: 42px; height: 50px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); display: grid; place-items: center; font-size: 20px; font-weight: 700; }
  .otp span.cur { border: 2px solid var(--accent); }
  .banner { border-radius: var(--radius); padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
  .banner.info { background: var(--fill2); border: 1px solid var(--line); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.bad { background: var(--bad-soft); color: var(--bad); }
  .timeline { display: flex; flex-direction: column; gap: 0; text-align: left; width: 100%; }
  .timeline div { display: flex; gap: 10px; align-items: flex-start; padding-bottom: 14px; position: relative; }
  .timeline div::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
  .timeline div:last-child::before { display: none; }
  .timeline b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; flex-shrink: 0; background: var(--fill); border: 1px solid var(--line); }
  .timeline b.done { background: var(--ok); border-color: var(--ok); color: #fff; }
  .timeline b.now { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; text-align: left; }
  .box { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 4px; flex-shrink: 0; margin-top: 1px; }
  .box.on { background: var(--accent); border-color: var(--accent); }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .demo { border-top: 1px dashed var(--line); padding-top: 10px; font-size: 12px; color: var(--faint); text-align: center; }
  .demo a { color: var(--accent); cursor: pointer; }
  .link { color: var(--accent); font-weight: 600; cursor: pointer; }
  .spacer { flex: 1; }

  /* batch 2: lobbies */
  .seg { display: flex; background: var(--fill2); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px; gap: 3px; }
  .seg span { flex: 1; text-align: center; padding: 7px 4px; border-radius: 7px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .seg span.on { background: var(--white); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .chip[data-toggle] { cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .choice { border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--white); padding: 12px; display: flex; gap: 10px; cursor: pointer; text-align: left; }
  .choice.on { border-color: var(--accent); background: var(--accent-soft); }
  .choice .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); flex-shrink: 0; margin-top: 2px; }
  .choice.on .radio { border: 5px solid var(--accent); }
  .tile { border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--white); padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; text-align: center; }
  .tile.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .switch { width: 42px; height: 24px; border-radius: 12px; background: var(--line); position: relative; cursor: pointer; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 21px; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); height: 44px; }
  .stepper b { width: 44px; text-align: center; font-size: 18px; color: var(--accent); cursor: pointer; }
  .stepper span { flex: 1; text-align: center; font-weight: 700; }
  .setting { display: flex; align-items: center; gap: 10px; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .codebar { display: flex; align-items: center; gap: 10px; background: var(--accent-soft); border-radius: var(--radius); padding: 10px 12px; }
  .codebar .code { font-size: 18px; background: var(--white); }
  .codebar.hidden { background: var(--fill2); border: 1px dashed var(--faint); color: var(--muted); }
  .ptabs { display: flex; background: var(--white); border-bottom: 1px solid var(--line); }
  .ptabs a { flex: 1; text-align: center; padding: 11px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .ptabs a.on { color: var(--accent); border-bottom-color: var(--accent); }
  .member { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--fill); }
  .member:last-child { border-bottom: 0; }
  .member .avatar { width: 32px; height: 32px; }
  .member.empty .avatar { background: transparent; border: 1.5px dashed var(--faint); }
  .msg { max-width: 78%; padding: 8px 11px; border-radius: 14px; background: var(--white); border: 1px solid var(--line); font-size: 13px; }
  .msg.me { align-self: flex-end; background: var(--accent); border-color: var(--accent); color: #fff; }
  .msg .who { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
  .sysmsg { align-self: center; font-size: 11px; color: var(--muted); background: var(--fill2); border-radius: 10px; padding: 3px 10px; }
  .composer { display: flex; gap: 8px; padding: 10px 12px; background: var(--white); border-top: 1px solid var(--line); position: sticky; bottom: 0; }
  .composer .input { flex: 1; height: 40px; border-radius: 20px; }
  .composer .send { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .rate-row { display: flex; align-items: center; gap: 10px; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .rate-row .opt { display: flex; gap: 6px; }
  .rate-row .opt span { height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid var(--line); display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
  .rate-row .opt span.on.good { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .rate-row .opt span.on.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 600; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 600; }
  .searchbar { display: flex; gap: 8px; }
  .searchbar .input { flex: 1; }

  /* batch 5: admin panel (desktop frame) */
  .phone.desktop { width: 100%; max-width: 1180px; min-width: 940px; height: 760px; border: 1px solid #b9b9b9; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .phone.desktop .status { background: #e4e4e4; height: 38px; justify-content: flex-start; gap: 12px; padding: 0 14px; font-weight: 400; }
  .phone.desktop .status .url { flex: 1; max-width: 520px; height: 24px; border-radius: 12px; background: #fff; display: flex; align-items: center; padding: 0 12px; color: var(--muted); font-size: 12px; }
  .admin { display: grid; grid-template-columns: 210px 1fr; flex: 1; min-height: 100%; }
  .anav { background: var(--white); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .anav .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; padding: 4px 8px 14px; }
  .anav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink); cursor: pointer; font-size: 13px; }
  .anav a:hover { background: var(--fill2); }
  .anav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .anav a .chip { margin-left: auto; height: 20px; padding: 0 7px; }
  .anav a.off { color: var(--faint); pointer-events: none; }
  .anav .who { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 8px 0; font-size: 12px; color: var(--muted); }
  .amain { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  .amain h2 { margin: 0; font-size: 20px; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .stat { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .stat b { display: block; font-size: 24px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .split { display: grid; grid-template-columns: 330px 1fr; gap: 16px; align-items: start; }
  .panel { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .panel h4 { margin: 0; font-size: 14px; }
  table.t { width: 100%; border-collapse: collapse; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; font-size: 13px; }
  table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--fill2); padding: 9px 12px; border-bottom: 1px solid var(--line); }
  table.t td { padding: 9px 12px; border-bottom: 1px solid var(--fill); vertical-align: middle; }
  table.t tr.sel td { background: var(--accent-soft); }
  table.t tr:last-child td { border-bottom: 0; }
  .qitem { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--white); cursor: pointer; }
  .qitem.sel { border-color: var(--accent); background: var(--accent-soft); }
  .toolbar { display: flex; gap: 10px; align-items: center; }
  .toolbar .input { height: 36px; }

  /* bottom tab bar */
  .tabs { display: flex; border-top: 1px solid var(--line); background: var(--white); height: 62px; flex-shrink: 0; align-items: center; }
  .tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--muted); cursor: pointer; text-decoration: none; }
  .tabs a.on { color: var(--accent); font-weight: 700; }
  .tabs a.fab span { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; margin-top: -18px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }

  @media (max-width: 1000px) {
    .shell { grid-template-columns: 1fr; height: auto; }
    .side, .notes { display: none; }
    .mobile-pick { display: block; position: sticky; top: 0; z-index: 5; background: var(--white); padding: 10px 16px; border-bottom: 1px solid var(--line); }
    .mobile-pick select { width: 100%; height: 38px; font: inherit; }
    .stage { padding: 16px; }
  }
  @media (max-width: 420px) {
    .phone { width: 100%; border-width: 0; border-radius: 0; height: calc(100vh - 58px); }
  }
</style>
</head>
<body>
<div class="mobile-pick"><select id="pick" aria-label="Screen"></select></div>
<div class="shell">
  <nav class="side" id="side">
    <h1>Chill Hub wireframes</h1>
    <div class="ver">v0.1 · mid-fidelity · mobile first</div>
  </nav>
  <main class="stage">
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●● ▮</span></div>
      <div class="screen" id="screen"></div>
    </div>
  </main>
  <aside class="notes" id="notes"></aside>
</div>

<template id="welcome" data-group="1. Sign-up & login" data-title="Welcome" data-spec="Entry point">

<template id="signup1" data-group="1. Sign-up & login" data-title="Sign up 1/3: Account" data-spec="ACC-01, ACC-02">

    <div class="field"><label>College email</label><div class="input filled">aungkoko@yourcollege.edu</div><span class="hint">Must end in @yourcollege.edu. We'll send a code to check it.</span></div>

<template id="pending" data-group="1. Sign-up & login" data-title="Waiting for approval" data-spec="ACC-03, ACC-05, ACC-06">

      <div><b class="done">✓</b><span><span class="strong">Email verified</span><br><span class="small">Today, 2:16 PM</span></span></div>
      <div><b class="now">…</b><span><span class="strong">Admin review</span><br><span class="small">In progress</span></span></div>
      <div><b></b><span><span class="strong" style="color:var(--muted)">Start playing</span></span></div>

  </div>

<template id="rejected" data-group="1. Sign-up & login" data-title="Sign-up rejected" data-spec="ACC-04, ACC-06">

<script>
  const TABS = [
    ["home", "Home", "i-home"], ["lobbies", "Lobbies", "i-users"], ["create1", "Create", "i-plus"],
    ["knowledge", "Knowledge", "i-book"], ["profile", "Profile", "i-user"],
  ];
  const ANAV = `
    <div class="brand"><div class="ph" style="width:26px;height:26px;border-radius:6px;font-size:8px">Logo</div>Chill Hub Admin</div>
    <a data-go="admin"><svg class="i"><use href="#i-home"/></svg>Dashboard</a>
    <a data-go="admin-approvals"><svg class="i"><use href="#i-check"/></svg>Approvals<span class="chip warn">7</span></a>
    <a data-go="admin-reports"><svg class="i"><use href="#i-flag"/></svg>Reports<span class="chip warn">3</span></a>
    <a data-go="admin-users"><svg class="i"><use href="#i-users"/></svg>Users</a>
    <a data-go="admin-games"><svg class="i"><use href="#i-book"/></svg>Games catalogue</a>
    <a class="off" title="Uses the same editor as the app"><svg class="i"><use href="#i-mail"/></svg>News posts</a>
    <a data-go="admin-settings"><svg class="i"><use href="#i-shield"/></svg>Settings &amp; audit log</a>
    <a class="off"><svg class="i"><use href="#i-up"/></svg>Tournaments · Phase 2</a>
    <div class="who">Signed in as <b>Thiri (Admin)</b><br>Moderators only see Reports, Users and the audit log.</div>`;
  const screens = [...document.querySelectorAll("template")];
  const side = document.getElementById("side"), pick = document.getElementById("pick");
  let group = null;
  for (const t of screens) {
    if (t.dataset.group !== group) {
      group = t.dataset.group;
      side.insertAdjacentHTML("beforeend", `<h2>${group}</h2>`);
      pick.insertAdjacentHTML("beforeend", `<optgroup label="${group}"></optgroup>`);
    }
    const todo = t.dataset.todo ? " todo" : "";
    side.insertAdjacentHTML("beforeend", `<a href="#${t.id}" class="${todo}" data-id="${t.id}">${t.dataset.title}</a>`);
    if (!todo) pick.lastElementChild.insertAdjacentHTML("beforeend", `<option value="${t.id}">${t.dataset.title}</option>`);
  }

  function show(id) {
    const t = document.getElementById(id);
    if (!t || t.tagName !== "TEMPLATE") return show("welcome");
    const frag = t.content.cloneNode(true);
    const note = frag.querySelector(".note");
    if (note) note.remove();
    const screen = document.getElementById("screen");
    const phone = document.querySelector(".phone"), status = phone.querySelector(".status");
    const desktop = t.dataset.frame === "desktop";
    phone.classList.toggle("desktop", desktop);
    status.innerHTML = desktop
      ? `<span>● ● ●</span><span class="url">https://chillhub.app/admin/${id.replace("admin-", "").replace("admin", "dashboard")}</span>`
      : `<span>9:41</span><span>●●● ▮</span>`;
    screen.replaceChildren(frag);
    screen.scrollTop = 0;
    screen.querySelectorAll(".anav").forEach(n => (n.innerHTML = ANAV));
    screen.querySelectorAll(".anav a[data-go]").forEach(a => a.classList.toggle("on", a.dataset.go === id));
    screen.querySelectorAll(".lc").forEach(renderLobbyCard);
    if (t.dataset.todo) {
      screen.insertAdjacentHTML("beforeend", `<div class="body center"><div class="spacer"></div><div class="ph" style="width:100%;height:220px">${t.dataset.title}<br>coming in the next batch</div><div class="spacer"></div></div>`);
    }
    if (t.dataset.tab) {
      screen.parentElement.querySelector(".tabs")?.remove();
      screen.insertAdjacentHTML("afterend", `<nav class="tabs">${TABS.map(([sid, label, ic]) =>
        `<a data-go="${sid}" class="${sid === "create1" ? "fab" : ""} ${sid === t.dataset.tab ? "on" : ""}">${
          sid === "create1" ? `<span><svg class="i"><use href="#${ic}"/></svg></span>` : `<svg class="i"><use href="#${ic}"/></svg>`}${label}</a>`).join("")}</nav>`);
    } else {
      document.querySelector(".phone .tabs")?.remove();
    }
    document.getElementById("notes").innerHTML =
      `<h3>${t.dataset.title}</h3><div class="spec">${t.dataset.spec || ""}</div>${note ? note.innerHTML : "<p>Not designed yet.</p>"}`;
    side.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.id === id));
    pick.value = id;
  }
  // Lobby card: game, mode & slots · start time · rank & roles · host & reputation
  function renderLobbyCard(el) {
    const d = el.dataset;
    const [have, total] = d.slots.split("/").map(Number);
    const dots = Array.from({ length: total }, (_, i) => `<i class="${i < have ? "" : "e"}"></i>`).join("");
    const roles = (d.roles || "").split(",").filter(Boolean)
      .map((r, i) => `<span class="chip accent">${i === 0 ? "Need: " : ""}${r}</span>`).join("");
    const rep = d.noshow ? `<span class="chip warn">${d.noshow} no-shows</span>`
      : `<span class="chip ok"><svg class="i" style="width:13px;height:13px"><use href="#i-up"/></svg>${d.rep}</span>`;
    el.classList.add("card");
    el.innerHTML = `
      <div class="row"><div class="game">${d.g}</div><div class="grow"><div class="strong">${d.name}</div>
        <div class="small"><svg class="i" style="width:12px;height:12px;vertical-align:-2px"><use href="#i-clock"/></svg> ${d.time}</div></div>
        ${d.lock ? `<svg class="i" style="color:var(--muted)"><use href="#i-lock"/></svg>` : ""}
        <span class="slots">${dots}</span><span class="small">${have}/${total}</span></div>
      <div class="chips"><span class="chip">${d.rank}</span>${roles}</div>
      <div class="row"><span class="avatar"></span><span class="small grow">Host <b style="color:var(--ink)">${d.host}</b></span>${rep}</div>`;
  }
  // Simple demo toggles: chips, segmented controls, switches
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-toggle]");
    if (!t) return;
    if (t.parentElement.classList.contains("seg") || t.dataset.toggle === "one") {
      t.parentElement.querySelectorAll("[data-toggle]").forEach(x => x.classList.remove("on"));
      t.classList.add("on");
    } else t.classList.toggle("on");
  });

  // Navigate without relying on hashchange (it does not fire in every preview/viewer)
  function go(id) {
    show(id);
    try { history.replaceState(null, "", "#" + id); } catch (_) {}
  }
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-go], .side a[data-id]");
    if (el) { e.preventDefault(); go(el.dataset.go || el.dataset.id); }
  });
  pick.onchange = () => go(pick.value);
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1) || "welcome");
</script>
</body>
</html>
